<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18434c"/>
      <stop offset="100%" stop-color="#0e282d"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2f1ee"/>
    </linearGradient>
    <filter id="toothShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Tooth Graphic -->
  <path
    filter="url(#toothShadow)"
    fill="url(#toothGrad)"
    d="M 32 17.5
       C 27.5 13.8 21 14 18 19
       C 15.5 23.2 15.8 28.5 17.5 35
       C 19 40.5 21.2 46.5 24 51.2
       C 25.5 52.8 27.8 51.8 28.5 48.5
       C 29.8 43 30.5 38.5 32 38
       C 33.5 38.5 34.2 43 35.5 48.5
       C 36.2 51.8 38.5 52.8 40 51.2
       C 42.8 46.5 45 40.5 46.5 35
       C 48.2 28.5 48.5 23.2 46 19
       C 43 14 36.5 13.8 32 17.5 Z"
  />

  <!-- Subtle dental enamel reflection on left side -->
  <path
    d="M 21 19
       C 18.5 23 18.8 28 19.8 33"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />

  <!-- Sparkle Accent in Brand Gold -->
  <path
    fill="#f4c95d"
    d="M 46 12
       C 46 15 44 17 41 17.5
       C 44 18 46 20 46 23
       C 46 20 48 18 51 17.5
       C 48 17 46 15 46 12 Z"
  />
  <circle cx="51.5" cy="11.5" r="1.5" fill="#f4c95d"/>
</svg>